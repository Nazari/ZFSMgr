name: Build

# What CI checks: the CLI, the agent and their tests build and pass on Linux, and the Java
# interface builds and passes its tests. The release packages —every platform's CLI and
# agent, the interface's .jar and the installers— are made on one machine with
# scripts/buildall-cross.sh (scripts/release-github.sh runs it), not here.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-and-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev

      - name: Build
        run: |
          cmake -S resources -B builds/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build builds/linux

      - name: Tests
        run: ctest --test-dir builds/linux --output-on-failure

  gui-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -f gui-java/pom.xml package

      - name: Upload the .jar
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-gui
          path: gui-java/target/zfsmgr-gui.jar
          if-no-files-found: error
