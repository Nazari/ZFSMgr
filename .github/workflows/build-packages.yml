name: Build Packages

# Tres etapas encadenadas:
#
#   1. agents-*       compilan SOLO el daemon, una por plataforma
#   2. agent-bundle   los reúne en un único artefacto zfsmgr-agents
#   3. build-*        compilan la GUI y empaquetan, con ese bundle a mano
#
# La etapa 1 está separada a propósito. La aplicación instala y actualiza el daemon
# en los hosts remotos, así que CUALQUIER paquete que se publique necesita llevar
# dentro los agentes de TODAS las plataformas, no solo el de la suya. Si cada
# plataforma solo compilara el suyo, o habría que encadenar builds completos entre
# sí, o cada paquete saldría cojo — que es justo lo que pasaba: el .app de macOS no
# llevaba ninguno y no podía desplegar nada.
#
# El daemon es un solo .cpp y se compila en poco tiempo, así que tener su propia
# etapa sale barato comparado con encadenar builds de la GUI.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Etapa 1: agentes ───────────────────────────────────────────────────────
  agents:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            key: linux-x86_64
            artifact: builds/agents-only/zfsmgr_agent
          - os: windows-latest
            key: windows-x86_64
            artifact: builds/agents-only/Release/zfsmgr_agent.exe
          - os: macos-14
            key: macos-universal
            artifact: builds/agents-only/zfsmgr_agent
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver versión de Qt
        id: qtver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_OUTPUT"

      # El daemon no usa Qt, pero el CMakeLists es común y hace find_package(Qt6)
      # para la GUI, así que la configuración falla sin él.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qtver.outputs.version }}
          cache: true

      # El agente de macOS tiene que ser universal como el .app, y para eso hace
      # falta un OpenSSL universal. La caché la comparte con el job de empaquetado,
      # que va después, así que solo se compila una vez.
      - name: Caché de OpenSSL universal (macOS)
        if: runner.os == 'macOS'
        id: ssl-cache
        uses: actions/cache@v4
        with:
          path: builds/openssl-universal
          key: openssl-universal-macos-${{ hashFiles('scripts/build-openssl-universal-macos.sh') }}

      - name: Compilar OpenSSL universal (macOS)
        if: runner.os == 'macOS' && steps.ssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x ./scripts/build-openssl-universal-macos.sh
          ./scripts/build-openssl-universal-macos.sh

      # Se compila el objetivo zfsmgr_agent a secas, sin la GUI: es lo único que
      # esta etapa tiene que producir.
      - name: Compilar el agente
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "${RUNNER_OS}" = "macOS" ]; then
            extra+=(-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
                    -DOPENSSL_ROOT_DIR="${PWD}/builds/openssl-universal")
          fi
          cmake -S resources -B builds/agents-only -DCMAKE_BUILD_TYPE=Release "${extra[@]}"
          cmake --build builds/agents-only --config Release --target zfsmgr_agent

      - name: Comprobar el agente
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.artifact }}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            archs="$(lipo -archs "${{ matrix.artifact }}")"
            echo "Arquitecturas: ${archs}"
            case "${archs}" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "Error: el agente de macOS no es universal (${archs})" >&2; exit 1 ;;
            esac
          fi

      - name: Subir el agente
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.key }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  agents-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar el agente (FreeBSD)
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y bash cmake qt6-base qt6-tools openssl git
          run: |
            cmake -S resources -B builds/agents-only -DCMAKE_BUILD_TYPE=Release
            cmake --build builds/agents-only --target zfsmgr_agent
            test -f builds/agents-only/zfsmgr_agent

      - name: Subir el agente
        uses: actions/upload-artifact@v4
        with:
          name: agent-freebsd-x86_64
          path: builds/agents-only/zfsmgr_agent
          if-no-files-found: error

  # ── Etapa 2: reunirlos en un solo artefacto ────────────────────────────────
  agent-bundle:
    runs-on: ubuntu-latest
    needs: [agents, agents-freebsd]
    steps:
      - name: Descargar los agentes
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: incoming

      # El agente de macOS es universal, así que el mismo binario vale para
      # macos-arm64 y macos-amd64, que son los nombres por los que pregunta
      # findDeployableAgentBinaryPath según el host de destino.
      - name: Componer el bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/linux-x86_64 bundle/windows-x86_64 bundle/freebsd-x86_64 \
                   bundle/macos-arm64 bundle/macos-amd64
          cp incoming/agent-linux-x86_64/zfsmgr_agent       bundle/linux-x86_64/zfsmgr_agent
          cp incoming/agent-windows-x86_64/zfsmgr_agent.exe bundle/windows-x86_64/zfsmgr_agent.exe
          cp incoming/agent-freebsd-x86_64/zfsmgr_agent     bundle/freebsd-x86_64/zfsmgr_agent
          cp incoming/agent-macos-universal/zfsmgr_agent    bundle/macos-arm64/zfsmgr_agent
          cp incoming/agent-macos-universal/zfsmgr_agent    bundle/macos-amd64/zfsmgr_agent
          chmod +x bundle/*/zfsmgr_agent*
          echo "Bundle de agentes:"
          find bundle -type f -exec ls -l {} +
          # Cinco es el número exacto que espera la app; si cambia, alguien tocó
          # esto sin actualizar el otro lado.
          n="$(find bundle -type f -name 'zfsmgr_agent*' | wc -l | tr -d ' ')"
          [ "${n}" -eq 5 ] || { echo "Error: se esperaban 5 agentes, hay ${n}" >&2; exit 1; }

      - name: Subir el bundle
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-agents
          path: bundle/
          if-no-files-found: error

  # ── Etapa 3: GUI y empaquetado ─────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: agent-bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La versión sale de qt-version.txt para que CI y el aprovisionamiento local
      # (scripts/provision-cross-targets.sh) no puedan divergir, como pasaba con el
      # 6.6.3 fijado aquí frente al 6.8.3 que se usaba en local.
      - name: Resolver versión de Qt
        id: qtver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qtver.outputs.version }}
          cache: true

      - name: Descargar el bundle de agentes
        uses: actions/download-artifact@v4
        with:
          name: zfsmgr-agents
          path: builds/agent-bundle

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./scripts/build-linux.sh
          ./scripts/build-linux.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1

      # Los scripts de build escriben en builds/<os>/, no en build-<os>/. Con las
      # rutas antiguas y if-no-files-found: warn, el workflow subía artefactos
      # vacíos y terminaba en verde. De ahí el error: si no hay ficheros, falla.
      # Las rutas help/** e i18n/** que había aquí tampoco casaban nunca: ambos
      # van compilados dentro del recurso Qt, no se copian al directorio de build.
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-linux
          path: |
            builds/linux/zfsmgr_qt
            builds/linux/zfsmgr_agent
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-windows
          path: |
            builds/windows/Release/zfsmgr_qt.exe
            builds/windows/Release/zfsmgr_agent.exe
          if-no-files-found: error

  build-freebsd:
    runs-on: ubuntu-latest
    needs: agent-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar el bundle de agentes
        uses: actions/download-artifact@v4
        with:
          name: zfsmgr-agents
          path: builds/agent-bundle

      - name: Build (FreeBSD)
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # qt6-linguisttools no existe en el repo de FreeBSD (verificado contra
            # packagesite.pkg) y pkg aborta el job entero al no encontrarlo. Tampoco
            # hacía falta: el proyecto no usa LinguistTools — no está en el
            # find_package de Qt6 ni hay lrelease/qt_add_translations en el CMake;
            # la i18n la resuelve i18nmanager.cpp.
            # bash va explícito: FreeBSD no lo trae de serie y build-freebsd.sh
            # lleva shebang de bash (y 29 construcciones que no son POSIX sh), así
            # que sin él el job muere con "env: bash: No such file or directory".
            pkg install -y bash cmake qt6-base qt6-tools openssl git
          run: |
            chmod +x ./scripts/build-freebsd.sh
            ./scripts/build-freebsd.sh

      - name: Upload FreeBSD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-freebsd
          path: |
            builds/freebsd/zfsmgr_qt
            builds/freebsd/zfsmgr_agent
          if-no-files-found: error

  # macos-14 y no macos-latest porque en Sequoia el enlazado murió con
  # "ld: framework 'AGL' not found". OJO, la causa NO está identificada: se atribuyó
  # al SDK de Xcode 16, pero macos-15-intel usaba Xcode 16.4 y compilaba sin
  # problema. Antes de volver a macos-latest hay que averiguar de dónde sale
  # realmente la referencia a AGL (sospecha: el FindOpenGL de CMake).
  build-macos:
    runs-on: macos-14
    needs: agent-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver versión de Qt
        id: qtver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qtver.outputs.version }}
          cache: true

      - name: Descargar el bundle de agentes
        uses: actions/download-artifact@v4
        with:
          name: zfsmgr-agents
          path: builds/agent-bundle

      # La caché la dejó caliente el job de agentes, así que aquí es un acierto.
      - name: Caché de OpenSSL universal
        id: ssl-cache
        uses: actions/cache@v4
        with:
          path: builds/openssl-universal
          key: openssl-universal-macos-${{ hashFiles('scripts/build-openssl-universal-macos.sh') }}

      - name: Compilar OpenSSL universal
        if: steps.ssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x ./scripts/build-openssl-universal-macos.sh
          ./scripts/build-openssl-universal-macos.sh

      - name: Build (macOS)
        shell: bash
        run: |
          chmod +x ./scripts/build-macos.sh
          ZFSMGR_OPENSSL_PREFIX="${PWD}/builds/openssl-universal" \
          ZFSMGR_AGENT_BUNDLE_DIR="${PWD}/builds/agent-bundle" \
            ./scripts/build-macos.sh --universal

      - name: Empaquetar bundle
        shell: bash
        run: |
          cd builds/macos
          app="$(ls -d *.app | head -n1)"
          # No se usa uname -m: el runner es arm64 pero el bundle es universal, y
          # etiquetarlo con la arquitectura de la máquina que lo compiló haría creer
          # que no sirve en un Mac Intel.
          bin="${app}/Contents/MacOS/$(ls "${app}/Contents/MacOS" | grep -v '\.dSYM$' | head -n1)"
          echo "Arquitecturas del ejecutable: $(lipo -archs "${bin}")"
          ditto -c -k --keepParent --sequesterRsrc "${app}" "ZFSMgr-universal.app.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-macos-universal
          path: builds/macos/*.app.zip
          if-no-files-found: error
