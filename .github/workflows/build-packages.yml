name: Build Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Un solo job de macOS: produce un .app UNIVERSAL (arm64 + x86_64) desde el
        # runner Apple Silicon. Los frameworks de Qt ya vienen universales; la única
        # pieza que faltaba era OpenSSL, que se compila para ambas arquitecturas con
        # scripts/build-openssl-universal-macos.sh. Antes hacían falta dos jobs y se
        # publicaban dos descargas.
        #
        # macos-14 y no macos-latest porque en Sequoia el enlazado murió con
        # "ld: framework 'AGL' not found". OJO, la causa NO está identificada: se
        # atribuyó al SDK de Xcode 16, pero macos-15-intel usaba Xcode 16.4 y
        # compilaba sin problema, así que esa explicación no se sostiene. Antes de
        # volver a macos-latest hay que averiguar de dónde sale realmente la
        # referencia a AGL (sospecha principal: el FindOpenGL de CMake, cuya versión
        # difiere entre imágenes).
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La versión sale de qt-version.txt para que CI y el aprovisionamiento local
      # (scripts/provision-cross-targets.sh) no puedan divergir, como pasaba con el
      # 6.6.3 fijado aquí frente al 6.8.3 que se usaba en local.
      - name: Resolver versión de Qt
        id: qtver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qtver.outputs.version }}
          cache: true

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./scripts/build-linux.sh
          ./scripts/build-linux.sh

      # Compilar OpenSSL dos veces cuesta varios minutos y no cambia salvo que se
      # suba su versión, así que se cachea contra la versión fijada en el script.
      - name: Caché de OpenSSL universal (macOS)
        if: runner.os == 'macOS'
        id: ssl-cache
        uses: actions/cache@v4
        with:
          path: builds/openssl-universal
          key: openssl-universal-${{ runner.os }}-${{ hashFiles('scripts/build-openssl-universal-macos.sh') }}

      - name: Compilar OpenSSL universal (macOS)
        if: runner.os == 'macOS' && steps.ssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x ./scripts/build-openssl-universal-macos.sh
          ./scripts/build-openssl-universal-macos.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x ./scripts/build-macos.sh
          ZFSMGR_OPENSSL_PREFIX="${PWD}/builds/openssl-universal" ./scripts/build-macos.sh --universal

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1

      # Un artefacto de Actions no preserva el bit de ejecución ni los enlaces
      # simbólicos de los frameworks de Qt, así que subir el .app como directorio
      # entrega un bundle que no arranca y con la firma rota. ditto conserva
      # permisos, symlinks y firma, y el zip viaja intacto.
      - name: Empaquetar bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd builds/macos
          app="$(ls -d *.app | head -n1)"
          # No se usa uname -m: el runner es arm64 pero el bundle es universal, y
          # etiquetarlo con la arquitectura de la máquina que lo compiló haría creer
          # que no sirve en un Mac Intel.
          bin="${app}/Contents/MacOS/$(ls "${app}/Contents/MacOS" | grep -v '\.dSYM$' | head -n1)"
          echo "Arquitecturas del ejecutable: $(lipo -archs "${bin}")"
          ditto -c -k --keepParent --sequesterRsrc "${app}" "ZFSMgr-universal.app.zip"

      # Los scripts de build escriben en builds/<os>/, no en build-<os>/. Con las
      # rutas antiguas y if-no-files-found: warn, el workflow subía artefactos
      # vacíos y terminaba en verde. De ahí el error: si no hay ficheros, falla.
      # Las rutas help/** e i18n/** que había aquí tampoco casaban nunca: ambos
      # van compilados dentro del recurso Qt, no se copian al directorio de build.
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-linux
          path: |
            builds/linux/zfsmgr_qt
            builds/linux/zfsmgr_agent
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-macos-universal
          path: builds/macos/*.app.zip
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-windows
          path: |
            builds/windows/Release/zfsmgr_qt.exe
            builds/windows/Release/zfsmgr_agent.exe
          if-no-files-found: error

  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (FreeBSD)
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # qt6-linguisttools no existe en el repo de FreeBSD (verificado contra
            # packagesite.pkg) y pkg aborta el job entero al no encontrarlo. Tampoco
            # hacía falta: el proyecto no usa LinguistTools — no está en el
            # find_package de Qt6 ni hay lrelease/qt_add_translations en el CMake;
            # la i18n la resuelve i18nmanager.cpp.
            # bash va explícito: FreeBSD no lo trae de serie y build-freebsd.sh
            # lleva shebang de bash (y 29 construcciones que no son POSIX sh), así
            # que sin él el job muere con "env: bash: No such file or directory".
            pkg install -y bash cmake qt6-base qt6-tools openssl git
          run: |
            chmod +x ./scripts/build-freebsd.sh
            ./scripts/build-freebsd.sh

      - name: Upload FreeBSD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-freebsd
          path: |
            builds/freebsd/zfsmgr_qt
            builds/freebsd/zfsmgr_agent
          if-no-files-found: error
