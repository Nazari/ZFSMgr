name: Build Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Dos imágenes de macOS a propósito: macos-14 es Apple Silicon y macos-13
        # es Intel, y cada una produce el .app de su arquitectura. No se hace un
        # binario universal porque el OpenSSL de Homebrew que enlaza el agente solo
        # trae la arquitectura de la máquina, así que un universal exigiría
        # compilar OpenSSL para ambas.
        #
        # Ninguna es macos-latest: el SDK de macOS 15 (Xcode 16) retiró el framework
        # AGL, al que Qt 6.8.3 sigue enlazando desde Qt6::Gui, así que en Sequoia el
        # enlazado muere con "ld: framework 'AGL' not found". El job pasaba hasta que
        # macos-latest saltó a Sequoia. Se podrá volver cuando se use un Qt cuyos
        # binarios de macOS ya no lo pidan.
        os: [ubuntu-latest, macos-14, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La versión sale de qt-version.txt para que CI y el aprovisionamiento local
      # (scripts/provision-cross-targets.sh) no puedan divergir, como pasaba con el
      # 6.6.3 fijado aquí frente al 6.8.3 que se usaba en local.
      - name: Resolver versión de Qt
        id: qtver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qtver.outputs.version }}
          cache: true

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./scripts/build-linux.sh
          ./scripts/build-linux.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x ./scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1

      # Un artefacto de Actions no preserva el bit de ejecución ni los enlaces
      # simbólicos de los frameworks de Qt, así que subir el .app como directorio
      # entrega un bundle que no arranca y con la firma rota. ditto conserva
      # permisos, symlinks y firma, y el zip viaja intacto.
      - name: Empaquetar bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd builds/macos
          app="$(ls -d *.app | head -n1)"
          arch="$(uname -m)"
          ditto -c -k --keepParent --sequesterRsrc "${app}" "ZFSMgr-${arch}.app.zip"
          # El nombre del artefacto lleva la arquitectura: con dos jobs de macOS,
          # un nombre fijo haría que el segundo choque con el del primero.
          echo "MAC_ARCH=${arch}" >> "$GITHUB_ENV"

      # Los scripts de build escriben en builds/<os>/, no en build-<os>/. Con las
      # rutas antiguas y if-no-files-found: warn, el workflow subía artefactos
      # vacíos y terminaba en verde. De ahí el error: si no hay ficheros, falla.
      # Las rutas help/** e i18n/** que había aquí tampoco casaban nunca: ambos
      # van compilados dentro del recurso Qt, no se copian al directorio de build.
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-linux
          path: |
            builds/linux/zfsmgr_qt
            builds/linux/zfsmgr_agent
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-macos-${{ env.MAC_ARCH }}
          path: builds/macos/*.app.zip
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-windows
          path: |
            builds/windows/Release/zfsmgr_qt.exe
            builds/windows/Release/zfsmgr_agent.exe
          if-no-files-found: error

  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (FreeBSD)
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # qt6-linguisttools no existe en el repo de FreeBSD (verificado contra
            # packagesite.pkg) y pkg aborta el job entero al no encontrarlo. Tampoco
            # hacía falta: el proyecto no usa LinguistTools — no está en el
            # find_package de Qt6 ni hay lrelease/qt_add_translations en el CMake;
            # la i18n la resuelve i18nmanager.cpp.
            # bash va explícito: FreeBSD no lo trae de serie y build-freebsd.sh
            # lleva shebang de bash (y 29 construcciones que no son POSIX sh), así
            # que sin él el job muere con "env: bash: No such file or directory".
            pkg install -y bash cmake qt6-base qt6-tools openssl git
          run: |
            chmod +x ./scripts/build-freebsd.sh
            ./scripts/build-freebsd.sh

      - name: Upload FreeBSD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zfsmgr-freebsd
          path: |
            builds/freebsd/zfsmgr_qt
            builds/freebsd/zfsmgr_agent
          if-no-files-found: error
