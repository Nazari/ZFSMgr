name: Formato

# The C++ lines each push or pull request touches follow .clang-format. Only those: older code
# was not reformatted in bulk (see .clang-format). And no Spanish text outside the catalogs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  formato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format 19
        # pipx: the runner's system Python refuses pip installs (PEP 668).
        run: pipx install clang-format==19.1.7
      - name: Changed lines follow the format
        env:
          BASE_PUSH: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_PR:-$BASE_PUSH}"
          # A push that creates the branch has no «before»: compare with the previous commit.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          # Where pipx put it (on the runners it is /opt/pipx_bin, not ~/.local/bin), and not
          # whatever clang-format the image may carry, which can be another version.
          CLANG_FORMAT="$(pipx environment --value PIPX_BIN_DIR)/clang-format" \
            scripts/formato.sh --check "$base"
      - name: No Spanish text outside the translation catalogs
        run: python3 scripts/revisa_castellano.py
